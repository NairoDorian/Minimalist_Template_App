name: 'Continuous Integration & Type Check'

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 'Validate Frontend & Rust Backend'
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-24.04', 'macos-latest', 'windows-latest']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies (Linux only)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev patchelf

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Validate code formatting (Prettier & cargo fmt)
        run: bun run format:check

      - name: Validate code lint (oxlint)
        run: bun run lint

      # Package-script indirection, like every other gate here: the command
      # line lives in package.json once, so CI, `bun run validate` and the git
      # hook cannot drift apart.
      - name: Validate TypeScript static types (tsc -b)
        run: bun run typecheck

      - name: Run unit tests (bun test)
        run: bun run test

      - name: Validate version mirrors in sync (before-commit --check)
        run: bun run before-commit --check

      - name: Validate Vite production bundle
        run: bun run vite:build

      - name: Validate Rust compilation (cargo check)
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # `src-tauri/src/webview_hardening.rs` is compiled ONLY in the release
      # profile on Windows (`not(debug_assertions)`), and it is the code that
      # names the `webview2-com` / `windows-core` / `tauri-runtime-wry` types —
      # the ones that must stay the instances Tauri links. Every other step here
      # builds the debug profile, so a version skew there used to pass CI and
      # fail the release build. This step is the release build's compile check.
      - name: Validate release-profile compilation (cargo check --release, Windows)
        if: matrix.os == 'windows-latest'
        run: cargo check --release --manifest-path src-tauri/Cargo.toml

      - name: Validate Rust lint (cargo clippy)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test
